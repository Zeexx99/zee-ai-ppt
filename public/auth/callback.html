<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zee AI - Authentication Complete</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <h3>Authentication in progress...</h3>
  <p>Closing window and returning to Zee AI for PowerPoint...</p>
  <script>
    Office.onReady(function () {
      // Check hash params or query params
      const hash = window.location.hash.substring(1);
      const query = window.location.search.substring(1);
      const params = new URLSearchParams(hash || query);

      const accessToken = params.get('access_token');
      const error = params.get('error');

      const message = {
        type: 'ZEE_AUTH_RESULT',
        token: accessToken,
        error: error
      };

      try {
        if (Office.context && Office.context.ui && Office.context.ui.messageParent) {
          Office.context.ui.messageParent(JSON.stringify(message));
        } else if (window.opener) {
          window.opener.postMessage(message, '*');
          window.close();
        }
      } catch (err) {
        console.error('Failed to notify parent frame:', err);
      }
    });
  </script>
</body>
</html>
