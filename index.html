<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Zee AI for PowerPoint</title>
    <link rel="icon" type="image/png" href="assets/icon-32.png" />
    <script>
      // Preserve history methods that Office.js occasionally nulls out in WebView2/IE
      window._savedReplaceState = window.history.replaceState;
      window._savedPushState = window.history.pushState;
    </script>
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
    ></script>
    <script>
      if (!window.history.replaceState && window._savedReplaceState) {
        window.history.replaceState = window._savedReplaceState;
      }
      if (!window.history.pushState && window._savedPushState) {
        window.history.pushState = window._savedPushState;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
